name: Déploiement production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            chgrp -R www-data wp-content || true
            find wp-content -type d -exec chmod 2775 {} \; || true
            find wp-content -type f -exec chmod 664 {} \; || true
            wp cache flush
            wp rewrite flush --hard
            curl -sf -o /dev/null http://localhost/ && echo "Smoke test OK" || (echo "Smoke test FAILED" && exit 1)
