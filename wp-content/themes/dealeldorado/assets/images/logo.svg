<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="DealElDorado">
  <!-- Price tag icon -->
  <g transform="translate(4, 8)">
    <!-- Tag body -->
    <path d="M8,0 L44,0 Q52,0 52,8 L52,40 Q52,48 44,48 L8,48 Q0,48 0,40 L0,8 Q0,0 8,0 Z" fill="#e85d04"/>
    <!-- Hole in tag -->
    <circle cx="10" cy="24" r="5" fill="white" opacity="0.9"/>
    <!-- Price lines -->
    <rect x="18" y="12" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="18" y="21" width="18" height="4" rx="2" fill="white" opacity="0.7"/>
    <rect x="18" y="30" width="22" height="4" rx="2" fill="white" opacity="0.5"/>
    <!-- Gold star badge -->
    <circle cx="46" cy="6" r="10" fill="#f4a261"/>
    <text x="46" y="10.5" font-size="11" fill="white" font-weight="900" text-anchor="middle" font-family="Arial">★</text>
  </g>
  <!-- Logo Text -->
  <text x="68" y="36" font-size="30" font-weight="900" font-family="Inter, Arial, sans-serif" fill="#1a1a2e" letter-spacing="-0.5">Deal</text>
  <text x="150" y="36" font-size="30" font-weight="900" font-family="Inter, Arial, sans-serif" fill="#e85d04" letter-spacing="-0.5">El</text>
  <text x="180" y="36" font-size="30" font-weight="900" font-family="Inter, Arial, sans-serif" fill="#f4a261" letter-spacing="-0.5">Dorado</text>
  <!-- Tagline -->
  <text x="68" y="55" font-size="11" font-family="Inter, Arial, sans-serif" fill="#6c757d" letter-spacing="0.5">Comparez les meilleurs prix</text>
</svg>
